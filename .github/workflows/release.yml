name: Build and Release PICO-8 Language Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NVM
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

      - name: Install Node.js 22
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          node --version
          npm --version

      - name: Install dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          npm install
          npm install -g postject@1.0.0-alpha.5
      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Build SEA binary
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          npm run build-sea
          chmod +x build/pico8-ls
          version="${VERSION#v}"  # Remove 'v' prefix if present
          cd build && tar czf "pico8-ls-${version}-linux-arm64.tar.gz" pico8-ls
          echo "Build directory contents:"
          ls -la
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            build/pico8-ls-${{ steps.get_version.outputs.version }}-linux-arm64.tar.gz
          body: |
            PICO-8 Language Server binary for Linux ARM64

            ### Installation
            1. Download and extract the archive:
               ```bash
               tar xzf pico8-ls-VERSION-linux-arm64.tar.gz
               ```
            2. Make the binary executable (if needed):
               ```bash
               chmod +x pico8-ls
               ```
